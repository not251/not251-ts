<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fretboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
      color: white;
      background-color: black;
    }
    h1 {
      margin-top: 20px;
    }
    .input-container {
      margin: 20px auto;
    }
    input, button {
      margin: 5px;
      padding: 10px;
      font-size: 16px;
    }
    .fretboard {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0px 0;
      background-color: black;
      padding: 10px 0;
      position: relative;
    }
    .string {
      display: flex;
      border: 1px solid white;
      margin: 2px 0;
    }
    .fret {
      width: 40px;
      height: 50px;
      text-align: center;
      line-height: 50px;
      border-right: 1px solid white;
      position: relative;
      color: black;
    }
    .fret:nth-child(1) {
      border-left: 2px solid white;
    }
    .note {
      background: white;
      color: black;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 12px;
      text-align: center;
      line-height: 20px;
    }
    .fret-numbers {
      display: flex;
      justify-content: center;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      color: white;
      background-color: black;
    }
    .fret-number {
      width: 40px;
      text-align: center;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h1>Fretboard</h1>
  <div class="input-container">
    <label for="tuning">Tuning (e.g., 40, 45, 50, 55, 59, 64):</label>
    <input type="text" id="tuning" placeholder="40, 45, 50, 55, 59, 64" value="40, 45, 50, 55, 59, 64">
    <br>
    <label for="numFrets">Frets:</label>
    <input type="number" id="numFrets" value="12" min="1">
    <br>
    <label for="handStretch">Hand Size:</label>
    <input type="number" id="handStretch" value="4" min="1">
    <br>
    <label for="chords">Chords (e.g., 60,64,67;65,69,72):</label>
    <input type="text" id="chords" placeholder="Enter chords here" value="62, 65, 69, 72; 59, 64, 67, 71; 60, 64, 67, 71">
    <br>
    <button onclick="visualizeChords()">View</button>
  </div>

  <div id="fretboard" class="fretboard"></div>

  <script>
    let tuning = [40, 45, 50, 55, 59, 64];
    let numFrets = 12;
    let currentVoicings = [];
    let chordInterval;

    function updateTuningAndFrets() {
      const tuningInput = document.getElementById('tuning').value.trim();
      const fretsInput = document.getElementById('numFrets').value;

      if (tuningInput) {
        tuning = tuningInput.split(' ').map(num => parseInt(num.trim(), 10));
      }
      numFrets = parseInt(fretsInput, 10) || 12;

      createFretboard();
    }

    function createFretboard() {
      const fretboard = document.getElementById('fretboard');
      fretboard.innerHTML = '';
      
      // Add fret numbers above the fretboard
      const fretNumbersDiv = document.createElement('div');
      fretNumbersDiv.classList.add('fret-numbers');
      for (let fret = 0; fret <= numFrets; fret++) {
        const fretNumberDiv = document.createElement('div');
        fretNumberDiv.classList.add('fret-number');
        fretNumberDiv.textContent = fret;
        fretNumbersDiv.appendChild(fretNumberDiv);
      }
      fretboard.appendChild(fretNumbersDiv);

      // Create strings and frets
      for (let i = 0; i < tuning.length + 1; i++) {
        const stringDiv = document.createElement('div');
        stringDiv.classList.add('string');
        for (let fret = 0; fret <= numFrets; fret++) {
          const fretDiv = document.createElement('div');
          fretDiv.classList.add('fret');
          fretDiv.dataset.string = i + 1;
          fretDiv.dataset.fret = fret;
          stringDiv.appendChild(fretDiv);
        }
        fretboard.appendChild(stringDiv);
      }
    }

    function clearNotes() {
      document.querySelectorAll('.note').forEach(note => note.remove());
    }

function placeNotes(voicing) {
  clearNotes();
  voicing.forEach(note => {
    // Reverse the string order
    const reversedStringIndex = tuning.length - note.string + 2;
    const selector = `.string:nth-child(${reversedStringIndex}) .fret:nth-child(${note.fret + 1})`;
    const fretDiv = document.querySelector(selector);
    const noteDiv = document.createElement('div');
    noteDiv.classList.add('note');
    noteDiv.textContent = note.midiNumber;
    fretDiv.appendChild(noteDiv);
  });
}
    function findMidiNumberLocations(midiNumber) {
      const locations = [];
      tuning.forEach((stringNote, stringIndex) => {
        for (let fret = 0; fret <= numFrets; fret++) {
          if (stringNote + fret === midiNumber) {
            locations.push({ midiNumber, fret, string: stringIndex + 1 });
          }
        }
      });
      return locations;
    }

    function findChordVoicings(chordNotes, maxStretch) {
      const allLocations = chordNotes.map(note => findMidiNumberLocations(note));
      const voicings = [];

      function backtrack(currentVoicing = [], index = 0) {
        if (index === allLocations.length) {
          const frets = currentVoicing.map(n => n.fret);
          if (Math.max(...frets) - Math.min(...frets) <= maxStretch) {
            voicings.push([...currentVoicing]);
          }
          return;
        }
        allLocations[index].forEach(location => {
          if (!currentVoicing.some(n => n.string === location.string)) {
            currentVoicing.push(location);
            backtrack(currentVoicing, index + 1);
            currentVoicing.pop();
          }
        });
      }
      backtrack();
      return voicings;
    }

    function visualizeChords() {
      updateTuningAndFrets();

      const handStretch = parseInt(document.getElementById('handStretch').value, 10);
      const chordsInput = document.getElementById('chords').value.trim();
      const chordSequence = chordsInput.split(';').map(chord => 
        chord.split(',').map(note => parseInt(note, 10))
      );

      currentVoicings = chordSequence.map(chord => findChordVoicings(chord, handStretch)[0]);

      let index = 0;
      clearInterval(chordInterval);
      chordInterval = setInterval(() => {
        placeNotes(currentVoicings[index]);
        index = (index + 1) % currentVoicings.length; // Loop back to start
      }, 2000);
    }

    createFretboard();
  </script>
</body>
</html>
